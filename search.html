<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Archive - REAL Institute</title>
    
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Pagefind CSS -->
    <link href="./pagefind/pagefind-ui.css" rel="stylesheet">
    
    <style>
        :root {
            /* Theme Colors */
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 34, 0.6);
            --border-color: rgba(218, 165, 32, 0.15);
            --border-focus: rgba(218, 165, 32, 0.45);
            --primary-color: #daa520;
            --primary-hover: #ffd700;
            --text-color: #e6edf3;
            --text-muted: #8b949e;
            
            /* Pagefind UI Variables Override */
            --pagefind-ui-primary: var(--primary-color);
            --pagefind-ui-text: var(--text-color);
            --pagefind-ui-background: transparent;
            --pagefind-ui-border: var(--border-color);
            --pagefind-ui-tag: rgba(218, 165, 32, 0.1);
            --pagefind-ui-font: 'Inter', sans-serif;
            --pagefind-ui-scale: 0.95;
            
            /* Newer Pagefind variables */
            --pf-text: var(--text-color);
            --pf-text-secondary: var(--text-muted);
            --pf-text-muted: var(--text-muted);
            --pf-background: transparent;
            --pf-border: var(--border-color);
            --pf-border-focus: var(--border-focus);
            --pf-primary: var(--primary-color);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            line-height: 1.6;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(218, 165, 32, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(52, 152, 219, 0.03) 0%, transparent 40%);
            background-attachment: fixed;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header Style */
        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 10px rgba(218, 165, 32, 0.1);
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Glassmorphic Panel for Search */
        .search-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: 30px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Back Link Button */
        .nav-links {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            gap: 6px;
        }

        .back-btn:hover {
            color: var(--primary-hover);
            transform: translateX(-3px);
        }

        /* Pagefind UI Customizations */
        .pagefind-ui__search-input {
            background-color: rgba(11, 14, 20, 0.8) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 8px !important;
            color: var(--text-color) !important;
            transition: all 0.3s ease !important;
            padding: 14px 20px 14px 44px !important;
        }

        .pagefind-ui__search-input:focus {
            border-color: var(--primary-color) !important;
            box-shadow: 0 0 0 3px rgba(218, 165, 32, 0.15) !important;
            outline: none !important;
        }

        .pagefind-ui__result {
            border-top: 1px solid rgba(255, 255, 255, 0.05) !important;
            padding: 24px 0 !important;
            transition: all 0.3s ease !important;
        }

        .pagefind-ui__result-title {
            font-family: 'Cormorant Garamond', serif !important;
            font-size: 1.55rem !important;
            font-weight: 600 !important;
            line-height: 1.3 !important;
        }

        .pagefind-ui__result-title a {
            color: var(--text-color) !important;
            text-decoration: none !important;
            transition: color 0.2s ease !important;
        }

        .pagefind-ui__result-title a:hover {
            color: var(--primary-hover) !important;
        }

        .pagefind-ui__result-excerpt {
            color: var(--text-muted) !important;
            font-size: 0.95rem !important;
            line-height: 1.6 !important;
            margin-top: 10px !important;
        }

        .pagefind-ui__result-excerpt mark {
            background-color: rgba(218, 165, 32, 0.2) !important;
            color: #fff !important;
            border-radius: 2px !important;
            padding: 0 4px !important;
            font-weight: 600 !important;
        }

        /* Filter styling */
        .pagefind-ui__filter-group {
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            border-radius: 8px !important;
            background: rgba(11, 14, 20, 0.4) !important;
            padding: 14px !important;
            margin-bottom: 12px !important;
        }

        .pagefind-ui__filter-name {
            text-transform: uppercase !important;
            font-size: 0.8rem !important;
            letter-spacing: 0.1em !important;
            color: var(--primary-color) !important;
            font-weight: 600 !important;
        }

        .pagefind-ui__filter-checkbox:checked {
            background-color: var(--primary-color) !important;
            border-color: var(--primary-color) !important;
        }

        .pagefind-ui__filter-label {
            font-size: 0.9rem !important;
            color: var(--text-color) !important;
            cursor: pointer !important;
        }

        .pagefind-ui__filter-value {
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
            margin-top: 8px !important;
        }

        /* Footer styling */
        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive styling */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.3rem;
            }
            .search-panel {
                padding: 20px 15px;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/adsense.css">
    <script defer src="assets/adsense.js"></script>
    <link rel="stylesheet" href="assets/math_ai_floater.css">
    <script src="assets/math_ai_floater.js" defer></script>
</head>
<body>

    <div class="container">
        <div class="nav-links">
            <a href="index.html" class="back-btn">← Back to Homepage</a>
            <a href="https://yogoreal.net" class="back-btn" target="_blank" rel="noopener">yogoreal.net 🌐</a>
            <a href="toc.html" class="back-btn">Table of Contents →</a>
        </div>

        <header>
            <h1>REAL Institute Archive</h1>
            <p>Search over 500 papers, journals, catalogs, and teachings</p>
        </header>

        <div class="search-panel">
            <!-- Pagefind Search container -->
            <div id="search"></div>
        </div>

        <footer>
            <p>&copy; 2026 <a href="https://yogoreal.net" style="color: var(--primary-color); text-decoration: none;" target="_blank" rel="noopener">REAL Institute</a>. Powered by Pagefind Search.</p>
        </footer>
    </div>

    <!-- Pagefind JS Initialization -->
    <script src="./pagefind/pagefind-ui.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            new PagefindUI({
                element: "#search",
                showSubResults: true,
                showImages: false,
                translations: {
                    placeholder: "Search for topics, authors, formulas, or keywords..."
                }
            });
        });
    </script>
    <aside class="real-adsense-slot" data-ad-slot-key="footer" aria-label="Advertisement"></aside>
    <script src="assets/live_viewers.js" defer></script>
</body>
</html>
